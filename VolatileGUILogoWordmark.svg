  <circle cx="79" cy="76" r="36" fill="#0c0f14" fill-opacity="0.6" stroke="#3ea6ff" stroke-width="9"/>
  <line x1="104" y1="102" x2="139" y2="137" stroke="#3ea6ff" stroke-width="13" stroke-linecap="round"/>
  <path d="M55 76 h11 l5 -16 l9 32 l8 -24 l5 8 h15"
