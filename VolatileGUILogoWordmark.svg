    <rect x="-78" y="-24" width="156" height="48" rx="8" fill="url(#ram)"/>
    <g fill="#0c0f14" fill-opacity="0.9">
      <rect x="-70" y="20" width="10" height="14" rx="2"/>
      <rect x="-52" y="20" width="10" height="14" rx="2"/>
      <rect x="-34" y="20" width="10" height="14" rx="2"/>
      <rect x="-16" y="20" width="10" height="14" rx="2"/>
      <rect x="2"   y="20" width="10" height="14" rx="2"/>
      <rect x="20"  y="20" width="10" height="14" rx="2"/>
      <rect x="38"  y="20" width="10" height="14" rx="2"/>
