  </defs>

  <!-- icon badge -->
  <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#bg)"/>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#glow)"/>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="none" stroke="#3ea6ff" stroke-opacity="0.25" stroke-width="2"/>

